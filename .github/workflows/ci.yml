name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pytest

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy --strict skills/

      - name: Pytest — unit
        run: pytest tests/unit -v

      - name: Pytest — integration (CLI stub, no sandbox creds needed)
        run: pytest tests/integration -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No-secret audit
        run: |
          set -eo pipefail
          # Refuse if any file under skills/, workflows/, tests/, docs/ contains an obvious
          # 64-hex sequence (potential private key) or long base58. .env, examples, fixtures
          # are exempted via path filtering.
          ! grep -REn '\b[0-9a-fA-F]{64}\b' skills workflows tests docs 2>/dev/null \
              --include='*.py' --include='*.md' --include='*.json' --include='*.html' \
              --exclude-dir='fixtures' || (echo "Possible secret found"; exit 1)

      - name: SKILL.md description length budget
        run: |
          set -eo pipefail
          python - <<'PY'
import re, sys
from pathlib import Path
failed = False
for f in sorted(Path("skills").glob("*/SKILL.md")):
    text = f.read_text(encoding="utf-8")
    m = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
    assert m, f"no frontmatter in {f}"
    fm = m.group(1)
    dm = re.search(r'^description:\s*"((?:[^"\\]|\\.)*)"', fm, re.MULTILINE)
    if dm is None:
        dm = re.search(r"^description:\s*(.+)$", fm, re.MULTILINE)
        if dm is None:
            print(f"{f}: NO description field")
            failed = True
            continue
        desc = dm.group(1)
    else:
        desc = dm.group(1)
    n = len(desc)
    status = "ok" if n <= 900 else "FAIL"
    print(f"{f}: {n} chars [{status}]")
    if n > 900:
        failed = True
sys.exit(1 if failed else 0)
PY
