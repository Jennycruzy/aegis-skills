name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('pyproject.toml') }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.6.9" "mypy==1.11.2" "pytest==8.3.3"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy skills/ --ignore-missing-imports

      - name: Pytest — unit
        run: pytest tests/unit -v

      - name: Pytest — integration (CLI stub, no sandbox creds needed)
        run: pytest tests/integration -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: No-secret audit
        run: |
          set -eo pipefail
          # Refuse if any file under skills/, workflows/, tests/, docs/ contains an obvious
          # 64-hex sequence (potential private key) or long base58. .env, examples, fixtures
          # are exempted via path filtering.
          ! grep -REn '\b[0-9a-fA-F]{64}\b' skills workflows tests docs 2>/dev/null \
              --include='*.py' --include='*.md' --include='*.json' --include='*.html' \
              --exclude-dir='fixtures' || (echo "Possible secret found"; exit 1)

      - name: SKILL.md description length budget
        run: python .github/scripts/check_skill_descriptions.py
